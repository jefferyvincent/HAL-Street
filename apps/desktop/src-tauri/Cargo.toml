[package]
name = "halstreet-panel"
version = "0.1.0"
description = "Read-only telemetry shell for the HAL Street trading agent"
authors = ["Jeffery"]
edition = "2021"

[lib]
name = "halstreet_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
